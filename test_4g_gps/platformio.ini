[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 115200

build_flags =
    -D MODEM_RX_PIN=17
    -D MODEM_TX_PIN=16
    -D MODEM_BAUD=115200
[platformio]
default_envs = esp32-s3-devkitc-1
core_dir = E:\pio