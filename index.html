<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laserbox bediening</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .box-selector {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .box-button {
            height: 48px;
            background: #555;
            color: white;
        }

        .box-button.box-active {
            background: #1687ff;
            color: white;
            box-shadow: 0 0 14px rgba(22, 135, 255, 0.8);
        }

        @keyframes blinkSequence {
            0%, 100% {
                background-color: #8fd694;
                color: #111;
            }

            50% {
                background-color: #ff2020;
                color: white;
                box-shadow: 0 0 18px rgba(255, 32, 32, 0.9);
            }
        }

        .sequence-active {
            animation: blinkSequence 0.7s infinite !important;
            font-weight: bold;
        }

        #selectedBoxTitle {
            text-align: center;
            margin-bottom: 15px;
            color: #7fc1ff;
        }

        @media (max-width: 600px) {
            .box-selector {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>

<body>
<div class="container">

    <div class="card">
        <h1>Laserbox bediening</h1>

        <div id="connection" class="offline">● OFFLINE</div>

        <div class="box-selector">
            <button id="box1" class="box-button box-active" type="button">Laserbox 1</button>
            <button id="box2" class="box-button" type="button">Laserbox 2</button>
            <button id="box3" class="box-button" type="button">Laserbox 3</button>
        </div>
    </div>

    <div class="card">
        <h2 id="selectedBoxTitle">Laserbox 01</h2>
        <div id="status">Wachten op verbinding...</div>
    </div>

    <div class="card">
        <h2>Automatische sequenties</h2>

        <div class="grid2">
            <button id="btnAll" type="button">ALL SEQUENCE</button>
            <button id="btnStop" class="red" type="button">STOP</button>
            <button id="btn14" type="button">LASER 1-4</button>
            <button id="btn58" type="button">LASER 5-8</button>
        </div>
    </div>

    <div class="card">
        <h2>Handmatige bediening</h2>

        <div class="laserGrid">
            <button id="l1" type="button">Laser 1</button>
            <button id="l2" type="button">Laser 2</button>
            <button id="l3" type="button">Laser 3</button>
            <button id="l4" type="button">Laser 4</button>
            <button id="l5" type="button">Laser 5</button>
            <button id="l6" type="button">Laser 6</button>
            <button id="l7" type="button">Laser 7</button>
            <button id="l8" type="button">Laser 8</button>
        </div>
    </div>

    <div class="card">
        <h2>MQTT Log</h2>
        <textarea id="log" readonly></textarea>
    </div>

</div>

<script src="app.js"></script>
</body>
</html>
